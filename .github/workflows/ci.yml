name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消旧跑：PR 连推时不再排队等已过期的全量门禁。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 4 台 runner 按全量耗时快照分片并行：单机 -n 4 约 11 分钟，
    # 分片后每片约 5–6 分钟（setup 并行，不叠加）。
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    env:
      # 与本地验证命令逐字节同口径（避免环境插件差异导致行为漂移）
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      # fetch-depth 0：版本门禁 test_version_matches_latest_tag 依赖
      # git tag——浅克隆（默认 depth 1 不取 tag）曾使 git describe 返回
      # 非零而门禁必红
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-xdist
      # tag 竞态守卫：发版 main 与 tag 两步推送，CI 由 main
      # push 触发时 checkout 快照可能还没拿到刚推的 tag，git describe
      # 128 曾让版本门禁随机红——测试前显式补拉 tag
      - name: 补拉 tag（版本门禁竞态守卫）
        run: git fetch --tags --force origin
      # webui 行为钉（共享时间轴轴位等）走真实渲染管线：demo 实例 +
      # Playwright Chromium，与 uitest 岗同款安装——缺内核时该族用例
      # 在 setup 即 ERROR（本地绿 CI 红的环境差异型失败）
      - name: 缓存 Playwright 内核
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-
      - name: 安装 Chromium 内核（webui 行为钉真渲染管线）
        run: playwright install --with-deps chromium
      # 中文字体：报告/表格渲染类用例（report.py 用 msyh 度量换行与行高）
      # 在无 CJK 字体的机器上只会落到 .notdef 方块，度量与真实中文排版
      # 不同——这类用例此前在 CI 上「跑起来但结果不对」地红，或被
      # has_cjk_font() 误判为可用而假绿。装上 Noto CJK 后与本地同口径。
      - name: 安装中文字体（报告渲染度量与本地同口径）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-list :lang=zh | head -5
      - name: 全仓语法检查
        run: python -m py_compile main.py webui.py report.py wizard.py core/*.py crawlers/*.py
      # 新渠道接线漏项（只登记了采集、没进健康/雷达/告警/前端表…）不再靠
      # 人对照 HANDOFF 清单：契约逐格读真实登记点，有缺口直接失败并点名。
      - name: 渠道平台契约（10 渠道 × 11 轴，有缺口即失败）
        run: python -m core.channel_contract --strict
      - name: 分片覆盖自检（并集=全部测试文件，新增文件不漏跑）
        run: python tools/ci_shard.py --stats 4
      - name: 选本片测试文件（按全量耗时快照贪心均分）
        id: shard
        run: echo "files=$(python tools/ci_shard.py --print 4 ${{ matrix.group }})" >> "$GITHUB_OUTPUT"
      - name: 全量测试 · 第 ${{ matrix.group }} 片（单测 + 推送链路演练 + 链接同源门禁 + 版本门禁）
        run: |
          set -o pipefail
          # 片内仍按文件整组分配：loadfile 避免同文件内共享 demo 端口/
          # 会话状态的用例被拆散；跨片由 4 台 runner 并行。
          python -m pytest ${{ steps.shard.outputs.files }} -q -n 4 -p xdist.plugin --dist loadfile 2>&1 | tee pytest.log
      - name: 失败测试摘要
        if: failure()
        run: |
          {
            echo '### pytest failures'
            echo '```'
            grep -E '^(FAILED|ERROR)' pytest.log | head -40
            echo '```'
            tail -30 pytest.log
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAILED|ERROR)' pytest.log | head -40 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done

  uitest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # UI 自检是单进程脚本，整轮约 6 分钟，已是 CI 关键路径。按
    # docs/uitest.py 的段号（0–49）切 2 片并行；段号由 tools/ui_shard.py
    # 从源码派生，新增段自动进片，--stats 自检并集/workflow 一致性。
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 缓存 Playwright 内核
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-
      - name: 安装 Chromium 内核
        run: playwright install --with-deps chromium
      - name: UI 分片覆盖自检（并集=全部分段，新增段不漏跑）
        run: python tools/ui_shard.py --stats 2
      - name: 全功能 UI 自检 · 第 ${{ matrix.group }} 片（任何 JS 报错即失败）
        run: |
          export UITEST_SECTIONS="$(python tools/ui_shard.py --print 2 ${{ matrix.group }})"
          export UITEST_RESULT="uitest_result_${{ matrix.group }}.txt"
          python docs/uitest.py
      - name: 上传自检结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-result-${{ matrix.group }}
          path: uitest_result_${{ matrix.group }}.txt

  # 稳定聚合检查：分片 job 名会变成 test (0..3)，分支保护/外部集成只需
  # 认这一个「全部泳道绿」的结论。
  ci-ok:
    if: always()
    needs: [test, uitest]
    runs-on: ubuntu-latest
    steps:
      - name: 汇总两个泳道
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.uitest.result }}" = "success"
