# NAS / 服务器容器化部署：
#   cp config.example.yaml config.yaml   # 首次：建配置（网页里配也行）
#   docker compose up -d
#   浏览器打开 http://NAS_IP:8765
services:
  ticket-monitoring:
    build: .
    # 预构建镜像（与 Release 同源时可用，免去本机构建）：
    # image: ghcr.io/dengmeiluan/ticket-monitoring:latest
    container_name: ticket-monitoring
    ports:
      - "8765:8765"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
      - ./user_data:/app/user_data
      - ./logs:/app/logs
      - ./debug:/app/debug
    restart: unless-stopped
